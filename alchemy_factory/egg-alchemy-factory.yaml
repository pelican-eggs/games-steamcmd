    sort: 3
    name: 'Admin password'
    description: 'Set a password for /admin <password> in game chat.'
    env_variable: ADMIN_PASSWORD
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - string
      - 'max:128'
  -
    sort: 8
    name: 'Auto update on startup'
    description: |-
      1: check for Steam server updates before starting. 0: skip the update check. Does not update a
      running server.
    env_variable: AUTO_UPDATE
    default_value: 1
    user_viewable: true
    user_editable: true
    rules:
      - required
      - boolean
  -
    sort: 4
    name: 'Maximum players'
    description: 'Maximum number of connected players.'
