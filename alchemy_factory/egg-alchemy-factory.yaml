_comment: 'DO NOT EDIT: FILE GENERATED AUTOMATICALLY BY PANEL'
meta:
  version: PLCN_v3
  update_url: 'https://raw.githubusercontent.com/pelican-eggs/games-steamcmd/refs/heads/main/alchemy_factory/egg-alchemy-factory.yaml'
exported_at: '2026-10-25T09:39:40+00:00'
name: 'Alchemy Factory'
author: mika.bomm@outlook.com
uuid: e27a66da-c351-4838-a358-9f292c28b03b
description: |-
  Alchemy Factory dedicated server (experimental Windows server running through Proton).

  Steam relay requires a primary game allocation between 1024 and 32767. Higher ports fail to accept
  relay connections.
icon: null
tags:
  - steamcmd
features:
  - steam_disk_space
docker_images:
  Proton: 'ghcr.io/pelican-eggs/steamcmd:proton'
file_denylist: {  }
startup_commands:
  Default: |-
    PROTON_USE_XALIA=0 xvfb-run -a proton run ./AlchemyFactory/Binaries/Win64/AlchemyFactoryServer-Win64-Shipping.exe -log -unattended & ALF_PID=$!;
    tail -c0 -F AlchemyFactory/Saved/Logs/AlchemyFactory.log --pid=$ALF_PID;
    wait $ALF_PID
config:
  files:
    ServerConfig.ini:
      parser: ini
      find:
        ServerSettings.server_port: '{{server.allocations.default.port}}'
        ServerSettings.server_name: '{{server.environment.SERVER_NAME}}'
        ServerSettings.server_password: '{{server.environment.SERVER_PASSWORD}}'
        ServerSettings.admin_password: '{{server.environment.ADMIN_PASSWORD}}'
        ServerSettings.query_port: '{{server.environment.QUERY_PORT}}'
        ServerSettings.max_clients: '{{server.environment.MAX_CLIENTS}}'
        ServerSettings.server_public: '{{server.environment.SERVER_PUBLIC}}'
        ServerSettings.server_relay: '{{server.environment.SERVER_RELAY}}'
  startup:
    done: 'join code:'
  logs: {  }
  stop: ^C
scripts:
  installation:
    script: |
      #!/bin/bash
      set -euo pipefail
      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps
      chown -R root:root /mnt/server
      cd /mnt/server/steamcmd
      curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz
      ./steamcmd.sh +@sSteamCmdForcePlatformType windows +@sSteamCmdForcePlatformBitness 64 +force_install_dir /mnt/server +login anonymous +app_update 1007 validate +app_update 4550060 validate +quit
      test -f /mnt/server/AlchemyFactoryServer.exe
      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so
      cp linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so

      # Preserve existing settings and saves when reinstalling.
      if [ ! -f /mnt/server/ServerConfig.ini ]; then
          printf "[ServerSettings]\n" > /mnt/server/ServerConfig.ini
      fi

      mkdir -p /mnt/server/AlchemyFactory/Saved/Logs
      touch /mnt/server/AlchemyFactory/Saved/Logs/AlchemyFactory.log
    container: 'ghcr.io/pelican-eggs/installers:debian'
    entrypoint: bash
variables:
