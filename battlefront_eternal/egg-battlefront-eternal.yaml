description: |-
  Battlefront Eternal is a GPL-3.0 engine for STAR WARS Battlefront (Classic, 2004). This is its
  headless dedicated server. It prepares its game data from your own copy of the game: set a Steam
  account that owns it, or upload the game's GameData folder to game/ and reinstall.
