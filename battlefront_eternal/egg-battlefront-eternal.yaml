    description: 'How many people can join, up to 64 (32 a side). Bots fill the rest of each army.'
    env_variable: MAX_PLAYERS
    default_value: 64
    user_viewable: true
    user_editable: true
    rules:
      - required
      - integer
      - 'between:1,64'
    sort: 2
  -
    name: 'Server Name'
    description: 'The name players see in the server browser and when they join.'
    env_variable: SERVER_NAME
    default_value: 'Battlefront Eternal server'
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - 'max:80'
    sort: 1
  -
    name: 'Steam Guard Code'
    description: |-
      A current Steam Guard code, if the account asks for one. SteamCMD remembers the login after it
      succeeds.
    env_variable: STEAM_AUTH
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - string
      - 'max:8'
    sort: 5
  -
    name: 'Steam Password'
    description: "The Steam account's password. Only the installation uses it."
    env_variable: STEAM_PASS
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - string
    sort: 4
  -
    name: 'Steam Username'
    description: |-
      A Steam account that owns STAR WARS Battlefront (Classic, 2004), to download the game during
      installation. Leave empty to upload the game's GameData folder to game/ yourself (a Steam or GOG
      copy).
    env_variable: STEAM_USER
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - string
    sort: 3
