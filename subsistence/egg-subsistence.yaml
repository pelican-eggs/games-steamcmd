name: Subsistence
author: syyyn84@gmail.com
uuid: eba19c87-5f0f-4063-939b-3e7d288c07c3
description: |-
  Subsistence dedicated server (Steam app 1362640). The dedicated server is Windows-only (UDK.exe /
  Unreal Engine 3), so this egg installs the Windows depot through SteamCMD and runs it under Wine +
  Xvfb.

  Allocate the game port (default 7777 UDP/TCP), a Steam query port (default 27015 UDP.)

  Official guide: https://steamcommunity.com/sharedfiles/filedetails/?id=2201638184
icon: null
tags:
  - steamcmd
  - wine
features:
  - steam_disk_space
docker_images:
  'ghcr.io/pelican-eggs/yolks:wine_latest': 'ghcr.io/pelican-eggs/yolks:wine_latest'
  'ghcr.io/pelican-eggs/yolks:wine_staging': 'ghcr.io/pelican-eggs/yolks:wine_staging'
file_denylist: {  }
startup_commands:
  Default: "rm -f /home/container/UDKGame/Logs/Launch.log; xvfb-run --auto-servernum --server-args='-screen 0 1024x768x16' wine /home/container/Binaries/Win64/UDK.exe server coldmap1?steamsockets -log -FORCELOGFLUSH -Port={{SERVER_PORT}}   -ini:UDKEngine:OnlineSubsystemSteamworks.OnlineSubsystemSteamworks.QueryPort={{QUERY_PORT}} & UDK_PID=$!; tail -F /home/container/UDKGame/Logs/Launch.log --pid=$UDK_PID"
config:
  files:
    UDKGame/Config/UDKDedServerSettings.ini:
      parser: ini
      find:
        ColdGame.ColdDedServerSettings.ProfileId: '{{server.environment.PROFILE_ID}}'
        ColdGame.ColdDedServerSettings.ServerName: '{{server.environment.SERVER_NAME}}'
        ColdGame.ColdDedServerSettings.ServerDescription: '{{server.environment.SERVER_DESCRIPTION}}'
        ColdGame.ColdDedServerSettings.HostedByName: '{{server.environment.HOSTED_BY}}'
        ColdGame.ColdDedServerSettings.Password: '{{server.environment.SERVER_PASSWORD}}'
        ColdGame.ColdDedServerSettings.AdminPassword: '{{server.environment.ADMIN_PASSWORD}}'
        ColdGame.ColdDedServerSettings.MaxPlayers: '{{server.environment.MAX_PLAYERS}}'
        ColdGame.ColdDedServerSettings.Difficulty: '{{server.environment.DIFFICULTY}}'
        ColdGame.ColdDedServerSettings.HuntersEnabled: '{{server.environment.HUNTERS_ENABLED}}'
        ColdGame.ColdDedServerSettings.HunterAttacks: '{{server.environment.HUNTER_ATTACKS}}'
        ColdGame.ColdDedServerSettings.DaysPerYear: '{{server.environment.DAYS_PER_YEAR}}'
        ColdGame.ColdDedServerSettings.MonthOverride: '{{server.environment.MONTH_OVERRIDE}}'
        ColdGame.ColdDedServerSettings.PvPDamage: '{{server.environment.PVP_DAMAGE}}'
        ColdGame.ColdDedServerSettings.PlayersCanDamagePlayerBases: '{{server.environment.PVP_BASE_DAMAGE}}'
        ColdGame.ColdDedServerSettings.OfflineBaseProtection: '{{server.environment.OFFLINE_BASE_PROTECTION}}'
        ColdGame.ColdDedServerSettings.PlayersCanAccessEnemyPlayerBaseItems: '{{server.environment.ENEMY_BASE_ACCESS}}'
        ColdGame.ColdDedServerSettings.NumPlayerOfflineHoursBeforeBaseDecay: '{{server.environment.BASE_DECAY_HOURS}}'
        ColdGame.ColdDedServerSettings.Mods: '{{server.environment.MODS}}'
  startup:
    done: 'Steam game server UID'
  logs: {  }
  stop: ^C
scripts:
  installation:
    script: |
      #!/bin/bash
      # Subsistence Dedicated Server installer
      # App ID 1362640 is Windows-only, so force the Windows depot and run it with Wine at runtime.

      set -e

      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      BLUE='\033[0;34m'
      NC='\033[0m'

      echo -e "${BLUE}-------------------------------------------------${NC}"
      echo -e "${YELLOW}Subsistence Dedicated Server (app 1362640, Windows via Wine)${NC}"
      echo -e "${BLUE}-------------------------------------------------${NC}"

      if [[ -z "${STEAM_USER}" ]] || [[ -z "${STEAM_PASS}" ]] || [[ "${STEAM_USER}" == "anonymous" ]]; then
          echo -e "Using anonymous Steam login."
          STEAM_USER=anonymous
          STEAM_PASS=""
          STEAM_AUTH=""
      else
          echo -e "Steam user set to ${STEAM_USER}"
      fi

      mkdir -p /mnt/server/steamcmd /mnt/server/steamapps
      cd /tmp
      curl -sSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
      tar -xzf steamcmd.tar.gz -C /mnt/server/steamcmd
      cd /mnt/server/steamcmd

      # SteamCMD can fail if ownership/HOME is wrong during install
      chown -R root:root /mnt || true
      export HOME=/mnt/server
      echo -e "${YELLOW}Downloading Windows dedicated server files (app ${SRCDS_APPID})...${NC}"
      ./steamcmd.sh +force_install_dir /mnt/server +login ${STEAM_USER} ${STEAM_PASS} ${STEAM_AUTH} +@sSteamCmdForcePlatformType windows +app_update 1007 +app_update ${SRCDS_APPID} $( [[ -z ${SRCDS_BETAID} ]] || printf %s "-beta ${SRCDS_BETAID}" ) $( [[ -z ${SRCDS_BETAPASS} ]] || printf %s "-betapassword ${SRCDS_BETAPASS}" ) ${INSTALL_FLAGS} validate +quit

      mkdir -p /mnt/server/.steam/sdk32 /mnt/server/.steam/sdk64
      cp -v /mnt/server/steamcmd/linux32/steamclient.so /mnt/server/.steam/sdk32/steamclient.so || true
      cp -v /mnt/server/steamcmd/linux64/steamclient.so /mnt/server/.steam/sdk64/steamclient.so || true

      # The Wine prefix is created by the runtime yolk on first start. Don't wipe it on reinstall.
      mkdir -p /mnt/server/UDKGame/Config /mnt/server/UDKGame/Logs /mnt/server/UDKGame/SaveData

      SETTINGS=/mnt/server/UDKGame/Config/UDKDedServerSettings.ini
      if [ ! -f "${SETTINGS}" ]; then
          echo -e "${YELLOW}Seeding UDKDedServerSettings.ini${NC}"
          cat > "${SETTINGS}" << 'EOF'
      [ColdGame.ColdDedServerSettings]
      ProfileId=1
      HuntersEnabled=true
      HunterAttacks=0
      Difficulty=normal
      DaysPerYear=36
      MonthOverride=-1
      Password=
      AdminPassword=changeme
      ServerName=Pelican Subsistence Server
      ServerDescription=A Subsistence dedicated server
      HostedByName=Pelican
      MaxPlayers=32
      NumPlayerOfflineHoursBeforeBaseDecay=0
      PvPDamage=true
      PlayersCanDamagePlayerBases=true
      OfflineBaseProtection=true
      PlayersCanAccessEnemyPlayerBaseItems=true
      Mods=
      EOF
      fi

      if [ ! -f /mnt/server/Binaries/Win64/UDK.exe ]; then
          echo -e "${RED}ERROR: Binaries/Win64/UDK.exe was not found after SteamCMD install.${NC}"
          echo -e "${RED}The Windows depot may have failed to download. Check the SteamCMD log above.${NC}"
          ls -la /mnt/server /mnt/server/Binaries || true
          exit 1
      fi

      echo -e "${GREEN}Installation completed.${NC}"
      echo -e "${YELLOW}First start initializes the Wine prefix and runs winetricks (${WINETRICKS_RUN}), which takes a few minutes.${NC}"
    container: 'ghcr.io/parkervcp/installers:debian'
    entrypoint: /bin/bash
variables:
