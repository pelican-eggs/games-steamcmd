      Password used to log in as admin. Join with ?password=THIS_VALUE or start
      steam.<uid>?password=THIS_VALUE
    env_variable: ADMIN_PASSWORD
    default_value: changeme
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - 'max:64'
    sort: 1
  -
    name: 'Auto Update'
    description: 'If 1, the Wine yolk entrypoint will run SteamCMD before each start.'
    env_variable: AUTO_UPDATE
    default_value: 1
    user_viewable: true
    user_editable: true
    rules:
      - boolean
    sort: 2
  -
